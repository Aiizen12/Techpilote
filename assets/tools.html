<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outils N1</title>
  <style>
    :root {
      --bg: #080b14;
      --card: #111524;
      --border: #1c2138;
      --primary: #6366f1;
      --primary-soft: rgba(99,102,241,0.15);
      --primary-b: rgba(99,102,241,0.45);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* ── Tab bar ─────────────────────────────────────────────────── */
    .tabbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      width: 100%;
      box-sizing: border-box;
    }
    .tabbar-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-right: 4px;
    }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s;
    }
    .tab:hover {
      border-color: rgba(99,102,241,0.4);
      color: var(--text);
    }
    .tab.active {
      background: var(--primary-soft);
      border-color: var(--primary-b);
      color: var(--primary);
    }
    .tab svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    /* ── Iframe container ────────────────────────────────────────── */
    .frame-wrap {
      flex: 1;
      overflow: hidden;
    }
    .frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="tabbar">
    <span class="tabbar-label">Outil :</span>
    <button class="tab active" id="tab-diagnostic" onclick="switchTool('diagnostic')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/>
      </svg>
      Aide au diagnostic N1
    </button>
    <button class="tab" id="tab-reseau" onclick="switchTool('reseau')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
      N1 Réseau
    </button>
  </div>

  <div class="frame-wrap">
    <iframe id="tool-frame" src="/diagnostic.html"></iframe>
  </div>

  <script>
    function switchTool(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      const src = name === 'diagnostic' ? '/diagnostic.html' : '/reseau.html';
      document.getElementById('tool-frame').src = src;
    }
  </script>

</body>
</html>
